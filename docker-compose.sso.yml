# Single sign-on with Microsoft Entra ID + activity report.
#
# Layered on top of docker-compose.yml:
#   docker compose --env-file .env.sso -f docker-compose.yml -f docker-compose.sso.yml up -d --build
#
# Needs: an HTTPS host name (Entra only allows http:// redirect URIs for
# localhost) and an Entra App Registration. See README.md ("Login SSO").
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    # On "frontend" only: it must reach login.microsoftonline.com. It is NOT on
    # the internal "backend" network, so the API container stays isolated.
    networks:
      - frontend
    expose:
      - "4180"
    environment:
      OAUTH2_PROXY_PROVIDER: entra-id
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in .env.sso}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in .env.sso}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET in .env.sso}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET in .env.sso}
      OAUTH2_PROXY_REDIRECT_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env.sso}/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # nginx only asks "is this session valid?" (auth_request); no proxying.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SCOPE: openid profile email
      # The UPN (preferred_username) is always present in Entra tokens; the
      # plain "email" claim is optional. It is used as the user identity.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
      # Access is limited to this tenant (issuer check) and, if enabled in
      # Entra ("Assignment required"), to the assigned users/groups.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # oauth2-proxy skips ID-token nonce verification by default; turn it on.
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_NONCE: "false"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: __Secure-oauth2_proxy
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      # Lets the sign-out link continue to Microsoft's sign-out page.
      OAUTH2_PROXY_WHITELIST_DOMAINS: login.microsoftonline.com
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
          pids: 64

  server:
    environment:
      AUTH_MODE: proxy
      AUDIT_DB_PATH: /data/audit.db
      AUDIT_RETENTION_DAYS: "45"
      REPORT_ADMINS: ${REPORT_ADMINS:-}
      # Number of reverse proxies in front of the API: nginx (1) plus the
      # company TLS proxy (1). Lower it if the TLS proxy is not a separate hop.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      SSO_LOGOUT_URL: /oauth2/sign_out?rd=https%3A%2F%2Flogin.microsoftonline.com%2F${ENTRA_TENANT_ID}%2Foauth2%2Fv2.0%2Flogout
    # The activity log is the only thing this application persists.
    volumes:
      - audit-data:/data

  web:
    depends_on:
      oauth2-proxy:
        condition: service_started
    volumes:
      - ./web/nginx.sso.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  audit-data: {}
