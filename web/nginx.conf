server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in the Server header or error pages.
    server_tokens off;

    # Allow large PDF uploads to pass through to the API.
    client_max_body_size 60m;

    # ── Security headers ──────────────────────────────────
    # Helmet only protects responses generated by the Express API. The HTML,
    # JS and CSS of the web app are served by nginx, so they need their own.
    # `always` also applies them to error responses (404/413/502 ...).
    #
    # No add_header may be placed inside a location block: nginx would then stop
    # inheriting this server-level set for that location.
    #
    # CSP notes:
    #  - The built app has no inline scripts/styles, so script-src/style-src
    #    stay strictly 'self'.
    #  - `upgrade-insecure-requests` is deliberately NOT used. Behind plain HTTP
    #    (e.g. http://<vm>:8080) it makes browsers re-request assets over HTTPS,
    #    which fails and leaves a blank page.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    # Ignored by browsers over plain HTTP; takes effect once TLS is terminated
    # in front of this container (matches what the API already sends).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # SPA routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API (Helmet) already sets these. Drop the upstream copies so the
        # server-level values above are the single source and nothing is sent
        # twice.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
    }
}
