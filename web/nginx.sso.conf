# nginx configuration for the SSO deployment (docker-compose.sso.yml mounts this
# file over /etc/nginx/conf.d/default.conf). Every request must be authenticated
# by oauth2-proxy (Microsoft Entra) before it reaches the web app or the API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in the Server header or error pages.
    server_tokens off;

    # Allow large PDF uploads to pass through to the API.
    client_max_body_size 60m;

    # TLS is terminated in front of this container, so nginx's own idea of the
    # scheme and port is wrong. Keep redirects relative so the browser resolves
    # them against the address the user actually typed.
    absolute_redirect off;

    # Entra session cookies can be large.
    large_client_header_buffers 4 16k;

    # ── Security headers (see nginx.conf for the reasoning) ───────────────────
    # No add_header may be placed inside a location block: nginx would then stop
    # inheriting this server-level set for that location.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ── oauth2-proxy: sign-in, callback, sign-out (reached by the browser) ────
    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Sub-request used by auth_request below. Not reachable from outside.
    # Answers 202 (+ identity headers) for a valid session, 401 otherwise.
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180/oauth2/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ── The web app: no session -> go and sign in, then come back to "/" ──────
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @sso_signin;
        try_files $uri $uri/ /index.html;
    }

    location @sso_signin {
        return 302 /oauth2/start?rd=%2F;
    }

    # ── The API: identity is forwarded to the backend ────────────────────────
    # An expired session must NOT redirect (fetch() would try to follow a
    # cross-origin redirect to Microsoft and fail obscurely): answer 401 JSON so
    # the page can tell the user to reload.
    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = @api_unauthorized;

        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;

        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Always overwritten with the verified values, so whatever a client
        # sends in these headers is discarded. The backend trusts them only
        # because it is reachable exclusively through this nginx.
        proxy_set_header X-Authenticated-User  $auth_user;
        proxy_set_header X-Authenticated-Email $auth_email;

        # The API (Helmet) already sets these. Drop the upstream copies so the
        # server-level values above are the single source.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
    }

    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"Session expired. Please reload the page to sign in again."}';
    }
}
